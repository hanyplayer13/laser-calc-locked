<style>

.pc{padding:12px}.pc.off{opacity:.6}

.bar{position:sticky;top:0;z-index:4;background:var(--bg);padding:2px 0 8px}

  .top-in,#tb,#nav{max-width:900px}
  main{max-width:900px;padding-inline:22px}
}

async function exportBackup() {
  const data = JSON.stringify({app: 'laser-calc', v: 1, exported: new Date().toISOString(), ...D, prefs: P}, null, 1), name = `laser-calc-${todayS()}.json`;
  const file = new File([data], name, {type: 'application/json'});
  if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file], title: name}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('فایل پشتیبان ذخیره شد');
}
function importText(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return toast('فایل یا متن معتبر نیست'); }
  const d = sanitizeData(o, D); if (!d) return toast('این فایل، قیمت‌های ماشین‌حساب نیست');
  if (!confirm(`${fmt(d.materials.length)} متریال و ${fmt(d.services.length)} خدمت جایگزین قیمت‌های فعلی می‌شود. ادامه می‌دهید؟`)) return;
  D = d; if (o.app === 'laser-calc' && o.prefs) P = sanitizePrefs({...P, ...o.prefs});
  fixRefs(); flush(); applyTheme(); render(); toast('قیمت‌ها وارد شد');
}

  if (qrJsPromise) return qrJsPromise;
  qrJsPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; sc.async = true;
    sc.onload = () => window.jsQR ? resolve(window.jsQR) : reject(new Error('کتابخانه‌ی اسکن QR بارگذاری نشد'));
    sc.onerror = () => reject(new Error('برای بارگذاری اسکنر QR به اینترنت نیاز است. اتصال اینترنت را بررسی کنید.'));
    document.head.appendChild(sc);

const B45 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
function b45decode(s) {
  if (!s || s.length % 3 === 1) throw new Error('ساختار QR معتبر نیست');
  const out = []; let i = 0;
  for (; i + 2 < s.length; i += 3) {
    const a = B45.indexOf(s[i]), b = B45.indexOf(s[i+1]), c = B45.indexOf(s[i+2]);
    if (a < 0 || b < 0 || c < 0) throw new Error('ساختار QR معتبر نیست');
    const n = a + b * 45 + c * 2025; if (n > 65535) throw new Error('داده‌ی QR خراب است');
    out.push(n >> 8, n & 255);
  }
  if (i < s.length) {
    const a = B45.indexOf(s[i]), b = B45.indexOf(s[i+1]);
    if (a < 0 || b < 0) throw new Error('ساختار QR معتبر نیست');
    const n = a + b * 45; if (n > 255) throw new Error('داده‌ی QR خراب است'); out.push(n);
  }

}
async function inflatePricePayload(bytes) {
  if (!('DecompressionStream' in window)) throw new Error('مرورگر این دستگاه فشرده‌گشایی امن را پشتیبانی نمی‌کند؛ مرورگر را به‌روز کنید.');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Response(stream).text();
}
async function acceptSignedPriceQR(token) {
  if (!LIC_ON || !/^[0-9a-f]{130}$/i.test(LIC_PUB)) throw new Error('نسخه‌ی قفل‌دار معتبر برای بررسی امضای QR نصب نشده است.');
  const code = String(token || '');
  if (!code.startsWith('LCPR1') || code.length <= 101) throw new Error('این QR متعلق به برنامه‌ی اصلی لیزر نیست.');
  const body = code.slice(5), packed = b45decode(body.slice(0, -96)), sig = b45decode(body.slice(-96));
  if (sig.length !== 64 || packed.length < 8 || packed.length > 200000) throw new Error('اطلاعات QR ناقص یا نامعتبر است.');
  const key = await crypto.subtle.importKey('raw', hex2b(LIC_PUB), {name:'ECDSA',namedCurve:'P-256'}, false, ['verify']);

  let o; try { o = JSON.parse(json); } catch (e) { throw new Error('محتوای QR قابل خواندن نیست.'); }
  if (!o || o.app !== 'laser-calc' || o.v !== 1 || o.source !== 'laser-invoice') throw new Error('این QR بسته‌ی قیمت معتبر برنامه‌ی اصلی نیست.');
  const d = sanitizeData(o, D); if (!d) throw new Error('ساختار فهرست قیمت‌ها معتبر نیست.');

  D = d; fixRefs(); flush(); render();

}
function stopQRScan() {
  cancelAnimationFrame(qrFrame); qrFrame = 0;
  if (qrStream) { qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
  const v = $('#qrv'); if (v) v.srcObject = null;
  $('#qrscan').hidden = true; qrBusy = false;
}
async function startQRScan() {
  if (qrBusy) return; qrBusy = true;
  const panel = $('#qrscan'), video = $('#qrv'), msg = $('#qrm'); panel.hidden = false; msg.textContent = 'در حال آماده‌سازی اسکنر…';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('دسترسی دوربین در این مرورگر فراهم نیست. برنامه را با HTTPS و مرورگر به‌روز باز کنید.');
    // Request the camera immediately in the click gesture (important for iOS Safari).
    const cameraPromise = navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    const decoderPromise = loadQRDecoder();
    qrStream = await cameraPromise;
    const decode = await decoderPromise;
    video.srcObject = qrStream; await video.play(); msg.textContent = 'دوربین را روبه‌روی QR برنامه‌ی اصلی نگه دارید…';
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d',{willReadFrequently:true});
    const tick = async () => {
      if (!qrStream || panel.hidden) return;
      if (video.readyState >= 2 && video.videoWidth) {
        const scale = Math.min(1, 900 / video.videoWidth); canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const im = ctx.getImageData(0,0,canvas.width,canvas.height), found = decode(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});
        if (found?.data) {
          stopQRScan();
          try { await acceptSignedPriceQR(found.data); } catch (err) { toast(err.message || 'QR نامعتبر است'); }
          return;
        }
      }
      qrFrame = requestAnimationFrame(tick);
    };
    qrFrame = requestAnimationFrame(tick);
  } catch (err) { stopQRScan(); toast(err.message || 'باز کردن دوربین ناموفق بود'); }
}
$('#qrs').innerHTML = '▦';
$('#qrs').addEventListener('click', startQRScan);
$('#qrx').addEventListener('click', stopQRScan);

/* ============================ routing & events ============================ */
function render() {
  if (!licOK) return;
  const t = TABS.find(x => x[0] === tab);
  $('#ttl').textContent = tab === 'calc' && P.shop ? P.shop : tab === 'calc' ? 'ماشین‌حساب لیزر' : t[1];
  $('#nav').innerHTML = TABS.map(([k, l, ic]) => `<a href="#${k}" class="${k === tab ? 'on' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${ICON[ic]}${l}</a>`).join('');
  if (tab === 'calc') viewCalc(); else { drawTb(); if (tab === 'box') viewBox(); else if (tab === 'prices') viewPrices(); else viewSettings(); }
  sizeDock();
}
function route() { const h = location.hash.slice(1); tab = TABS.some(t => t[0] === h) ? h : 'calc'; render(); window.scrollTo(0, 0); }

/* ============================ back button / exit ============================
   Tab changes replace the current entry, so Back never walks through visited tabs.
   The first Back returns to the base entry and shows a hint; a second real Back can leave the app.
   The Exit button now performs those two history-back steps itself, in sequence. Browsers may still
   block scripted window closing when there is no previous history entry; in that case we explain the platform limit.
   Nothing is reset: local data and activation stay on the device. */
function backArm() {
  try { const st = history.state; if (!st || st.lc !== 'app') { history.replaceState({lc: 'base'}, ''); history.pushState({lc: 'app'}, ''); } } catch (e) {}
}
let exitInProgress = false, exitBackCount = 0, exitFallbackTimer = 0;
['pointerup', 'click', 'keydown'].forEach(ev => addEventListener(ev, backArm, true));
addEventListener('popstate', () => {
  if (exitInProgress) {
    if (exitBackCount === 1) {
      exitBackCount = 2;
      // Wait for the first Back navigation to finish, then perform the second one.
      setTimeout(() => { if (exitInProgress && exitBackCount === 2) { try { history.back(); } catch (e) {} } }, 100);
      return;
    }
    exitInProgress = false;
    if (exitFallbackTimer) clearTimeout(exitFallbackTimer);
    return;
  }
  const st = history.state;
  if (st && st.lc === 'base') toast('برای خروج، یک بار دیگر «برگشت» را بزنید');
});
addEventListener('pagehide', () => {
  exitInProgress = false;
  if (exitFallbackTimer) clearTimeout(exitFallbackTimer);
});
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('#nav a'); if (!a) return;
  const k = (a.getAttribute('href') || '').slice(1); if (!TABS.some(t => t[0] === k)) return;
  e.preventDefault();
  try { history.replaceState(history.state, '', '#' + k); } catch (x) {}
  route();
});
function exitApp() {
  if (exitInProgress) return;
  flush();                                                       // persist current values before leaving
  exitInProgress = true;
  exitBackCount = 1;
  if (!history.state || history.state.lc !== 'app') backArm();   // ensure the first Back has the app's base entry
  try { window.close(); } catch (e) {}                           // works in some installed-app contexts
  try { history.back(); } catch (e) {                             // first Back step
    exitInProgress = false;
    return toast('مرورگر اجازه‌ی خروج خودکار نمی‌دهد؛ از دکمه‌ی خانه یا فهرست برنامه‌های گوشی استفاده کنید');
  }
  exitFallbackTimer = setTimeout(() => {
    if (!exitInProgress || document.hidden) return;
    exitInProgress = false;
    toast('مرورگر اجازه‌ی بستن خودکار را نمی‌دهد؛ از دکمه‌ی خانه یا فهرست برنامه‌های گوشی خارج شوید');
  }, 1600);
}
function sizeDock() { const h = Math.ceil($('#dock').getBoundingClientRect().height); document.documentElement.style.setProperty('--dock-h', h + 'px'); }
try { new ResizeObserver(sizeDock).observe($('#dock')); } catch (e) {}

const rowOf = el => C.rows.find(r => String(r.u) === el.closest('[data-u]')?.dataset.u);
main.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.f) { const it = rowOf(el); if (!it) return;
    if (d.f === 'price') it.price = rawStore(el); else if (d.f === 'labor') it.labor = rawStore(el); else if (d.f === 'svc') it.svcs[d.k] = el.value; else if (d.f !== 'mat') it[d.f] = el.value;

  if (d.b) { C.box[d.b] = d.b === 'p' ? rawStore(el) : el.value; updSide(); save(); return; }
  if (d.n) { C.neon[d.n] = d.n === 'p' ? rawStore(el) : el.value; updSide(); save(); return; }
  if (d.m || d.s) {
    const card = el.closest('[data-id]'), isM = !!d.m, k = d.m || d.s, o = (isM ? D.materials : D.services).find(x => x.id === +card.dataset.id); if (!o) return;
    if (k === 'name') o.name = el.value.slice(0, 80); else if (k === 'note') o.note = el.value.slice(0, 200); else if (k === 'unit') o.unit = el.value.slice(0, 30);

    else if (k === 'price') o.price = Math.max(0, Math.round(U2R(num(moneyFmt(el)))));

    save(); return; }

main.addEventListener('change', e => {

    if (d.m === 'kind') o.kind = el.value === 'roll' ? 'roll' : 'sheet'; else o.active = el.checked ? 1 : 0;
    save(); $('#plist').innerHTML = plist(); return; }

});

document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]'); if (cp) return void copy(cp.dataset.copy);
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, d = b.dataset;
  switch (a) {
    case 'theme': P.mode = isDark() ? 'light' : 'dark'; applyTheme(); save(); if (tab === 'settings') viewSettings(); break;
    case 'seen': store.set('lc.seen', '1'); $('#intro')?.remove(); break;
    case 'radd': C.rows.push(newRow()); save(); viewCalc(); { const els = $$('#rows .card'); els[els.length - 1]?.scrollIntoView({behavior: 'smooth', block: 'start'}); } break;
    case 'rdel': { const it = rowOf(b); C.rows = C.rows.filter(r => r !== it); save(); viewCalc(); } break;

    case 'copy': copy(rawU(totals().tot)); break;
    case 'share': { const text = summary(); if (navigator.share) navigator.share({text}).catch(err => { if (err.name !== 'AbortError') copy(text); }); else copy(text); } break;

      arr.push(isM ? {id: nid, name: '', kind: 'sheet', thickness: null, sheet_l: 100, sheet_w: 100, price: 0, note: '', active: 1} : {id: nid, name: '', unit: 'سانتی‌متر', price: 0, divisor: 1, active: 1});
      q = ''; save(); viewPrices(); const cards = $$('#plist .card'); const last = cards[cards.length - 1]; last?.scrollIntoView({block: 'center'}); setTimeout(() => $('input[type=text]', last)?.focus(), 250); } break;
    case 'mdel': case 'sdel': { const card = b.closest('[data-id]'); removeItem(a === 'mdel' ? 'm' : 's', +card.dataset.id); } break;
    case 'pref': P[d.p] = d.v; applyTheme(); save(); render(); break;

    case 'export': exportBackup(); break;
    case 'import': $('#ifile').click(); break;
    case 'itext': { const t = $('#itext').value.trim(); if (t) importText(t); else toast('متن را بچسبانید'); } break;
    case 'reset': if (confirm('همه‌ی متریال‌ها، خدمات و تنظیمات محاسبه به مقدار پیش‌فرض برمی‌گردد. ادامه می‌دهید؟')) { D = defaults(); fixRefs(); flush(); render(); toast('قیمت‌های پیش‌فرض برگشت'); } break;
    case 'copyid': copy(devId()); break;

});
/* keyboard: numeric pad comes from inputmode; select-all on focus; Enter jumps to the next field; the tab bar hides while typing */
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.matches?.('input.num')) setTimeout(() => { try { el.select(); } catch (x) {} }, 0);
  if (el.matches?.('input,select,textarea') && matchMedia('(pointer:coarse)').matches) { document.body.classList.add('kb'); sizeDock(); }
