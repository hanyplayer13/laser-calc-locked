<script>
/* apply the saved theme before first paint (no white flash in dark mode) */
try {
  var p = JSON.parse(localStorage.getItem('lc.prefs') || '{}'), d = p.mode === 'dark' || (p.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = d ? 'dark' : 'light';

<style>

@media (min-width:700px){body{font-size:calc(var(--fs) + 1px)}}
